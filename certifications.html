<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certifications — Preetham N</title>
  <meta name="description" content="Industry certifications by Preetham N — Oracle, Red Hat, Cisco, NPTEL, CodeChef, Infosys." />

  <!-- Google Fonts: match main portfolio exactly -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="certifications.css" />
</head>

<body class="dark-theme" data-theme="obsidian">

  <!-- ═══════════════════════════════════════════
       NAV BAR
       ═══════════════════════════════════════════ -->
  <nav class="c-nav" aria-label="Page navigation">
    <a href="index.html" class="c-nav__back" aria-label="Back to portfolio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      <span>Portfolio</span>
    </a>

    <div class="c-nav__center">
      <span class="c-nav__eyebrow">Preetham N</span>
      <span class="c-nav__sep">·</span>
      <span class="c-nav__title">Certifications</span>
    </div>

    <!-- Theme picker -->
    <div class="c-nav__right">
      <button class="c-theme-btn" id="themeBtn" aria-label="Change theme" title="Change theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
      <div class="c-theme-menu" id="themeMenu" hidden role="listbox" aria-label="Color themes">
        <button class="c-theme-opt" data-theme="obsidian" role="option">🌑 Obsidian Gold</button>
        <button class="c-theme-opt" data-theme="cyber"    role="option">💙 Cyber Midnight</button>
        <button class="c-theme-opt" data-theme="emerald"  role="option">💚 Emerald Luxury</button>
        <button class="c-theme-opt" data-theme="amethyst" role="option">💜 Royal Amethyst</button>
        <button class="c-theme-opt" data-theme="warm"     role="option">🌤 Editorial Warm</button>
      </div>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════
       HERO
       ═══════════════════════════════════════════ -->
  <header class="c-hero">
    <p class="c-hero__eyebrow">Industry Credentials · Verified Achievements</p>
    <h1 class="c-hero__title">My <em>Certifications</em></h1>
    <p class="c-hero__sub">
      <span id="certCount">6</span> globally recognised certifications across Java, Networking, Cloud &amp; more
    </p>
  </header>

  <!-- ═══════════════════════════════════════════
       STAGE — deck or grid renders here
       ═══════════════════════════════════════════ -->
  <main class="c-stage" id="stage">

    <!-- ── DECK VIEW ── -->
    <section class="c-deck-section" id="deckSection" aria-label="Certifications deck — click to expand">

      <!-- The stacked deck of cards -->
      <div class="c-deck" id="deck" role="button" tabindex="0"
           aria-label="Click to expand certifications">
        <!-- Back layer cards (decorative, JS renders) -->
        <div class="c-deck__layer" data-layer="3" aria-hidden="true"></div>
        <div class="c-deck__layer" data-layer="2" aria-hidden="true"></div>
        <div class="c-deck__layer" data-layer="1" aria-hidden="true"></div>

        <!-- Front card -->
        <div class="c-deck__front" aria-hidden="true">
          <div class="c-deck__shimmer"></div>
          <p class="c-deck__label">My Certifications</p>

          <!-- Logo cluster — populated by JS -->
          <div class="c-deck__cluster" id="logoCluster"></div>

          <p class="c-deck__count" id="deckCount"></p>
          <p class="c-deck__hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
            Tap to explore
          </p>
        </div>
      </div>

    </section>

    <!-- ── GRID VIEW ── -->
    <section class="c-grid-section" id="gridSection" hidden aria-label="All certifications">

      <!-- Filter pills -->
      <div class="c-filters" id="filterBar" aria-label="Filter certifications">
        <button class="c-filter active" data-filter="all">All</button>
        <button class="c-filter" data-filter="java">Java</button>
        <button class="c-filter" data-filter="networks">Networking</button>
        <button class="c-filter" data-filter="competitive">Competitive</button>
      </div>

      <!-- The grid — cards injected by JS -->
      <div class="c-grid" id="certGrid" role="list"></div>

      <!-- Stack back button -->
      <div class="c-grid-actions">
        <button class="c-stack-btn" id="stackBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Stack them back
        </button>
      </div>

    </section>

  </main>

  <!-- ═══════════════════════════════════════════
       LIGHTBOX
       ═══════════════════════════════════════════ -->
  <div class="c-lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Certificate viewer">
    <div class="c-lightbox__backdrop" id="lbBackdrop"></div>
    <div class="c-lightbox__box">
      <button class="c-lightbox__close" id="lbClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="c-lightbox__img-wrap">
        <img class="c-lightbox__img" id="lbImg" src="" alt="" />
      </div>
      <div class="c-lightbox__footer">
        <p class="c-lightbox__name" id="lbName"></p>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="certifications.js"></script>
</body>
</html>
